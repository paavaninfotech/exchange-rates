name: One-Time Backfill Historical Rates

on:
  workflow_dispatch: # This makes it a manually triggered action

jobs:
  backfill-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill script
        run: python backfill_rates.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/
          git commit -m "Automated backfill: Historical Exchange Rates (2025 to Today)" || exit 0
          git push
